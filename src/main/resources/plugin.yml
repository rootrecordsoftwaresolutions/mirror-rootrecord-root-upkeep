name: Root-Upkeep
version: '${version}'
main: com.rootrecord.minecraft.rootupkeep.RootUpkeepPlugin
api-version: '26.1'
description: RootMC inactivity tax for idle players, towns, and nations.
author: Root Record
website: https://rootmc.net
softdepend: [Vault, Towny, Root-Essentials, RootMC]
loadafter: [Vault, Towny, Root-Essentials]
commands:
  rootupkeep:
    description: Admin controls for inactivity tax
    usage: /<command> reload|run
    permission: rootupkeep.admin
permissions:
  rootupkeep.admin:
    description: Reload config and manually trigger inactivity tax
    default: op
